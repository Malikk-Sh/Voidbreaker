name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget (≤ 2 MB per Tech doc)
        run: |
          size=$(du -sb dist | cut -f1)
          echo "dist: $size bytes"
          test "$size" -le 2097152
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run smoke
        env:
          SMOKE_SHOT: smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voidbreaker-dist
          path: |
            dist
            smoke.png
          if-no-files-found: ignore
